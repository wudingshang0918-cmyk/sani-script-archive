const THEMES = ["问候与拜访", "做什么 去哪里", "询问", "介绍", "喜好", "请求帮助", "问路", "时间", "年龄", "语言", "天气", "购物", "比较", "衣着", "打电话", "看病", "照相", "理发", "餐馆", "乘车", "农业", "工作", "教育", "婚姻", "旅游", "介绍石林"];
let curTheme = "全部";
const list = document.getElementById("list");
const q = document.getElementById("q");
const player = document.getElementById("player");

function renderThemes(){
  const el = document.getElementById("themes");
  el.innerHTML = "";
  ["全部", ...THEMES].forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t;
    if(t===curTheme) b.classList.add("on");
    b.onclick = ()=>{ curTheme=t; renderThemes(); render(); };
    el.appendChild(b);
  });
}
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function render(){
  const kw = q.value.trim().toLowerCase();
  const items = DATA.filter(d=>{
    if(curTheme!=="全部" && d.th!==curTheme) return false;
    if(!kw) return true;
    return (d.zh+d.ipa+d.zy+d.zy2).toLowerCase().includes(kw);
  });
  list.innerHTML = "";
  if(!items.length){ list.innerHTML = '<div class="empty">没有找到</div>'; return; }
  items.forEach(d=>{
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="top">
        <div class="num">${d.n}</div>
        <div class="zh">${esc(d.zh)}</div>
        ${d.audio?`<button class="play">🔊</button>`:""}
      </div>
      <div class="meta">
        <span class="th">${esc(d.th)}</span>
        <div><span class="ipa">${esc(d.ipa)}</span></div>
        ${d.zy?`<div>直译：${esc(d.zy)}</div>`:""}
        ${d.zy2?`<div>注音：${esc(d.zy2)}</div>`:""}
      </div>`;
    const btn = c.querySelector(".play");
    if(btn) btn.onclick = ()=>{ player.src = d.audio; player.play(); btn.textContent="▶"; setTimeout(()=>btn.textContent="🔊", 1200); };
    list.appendChild(c);
  });
}
q.oninput = render;
renderThemes(); render();
