毕卫华 编委会副主任：冯英毕玉昌李毅飞黄文云 编彝 著：王向方 文：王向方毕华玉 说明 《石林撒尼口语400句》收人云南石林彝族自治县彝族 支系撒尼人常用口语400句，分别为《问候与拜访》、《做 什么？去哪里？》、《询问》、《介绍》、《请求帮助》、 《问路》、《天气》等26个日常生活情景对话，每个情景 对话包括若干语句。 石林县是彝族撒尼支系聚居地区，全县24万人，撒尼人 占三分之一。撒尼语是彝语东南部方言的一个次方言，是撒 尼人通用的语言，98%以上撒尼人在家庭内、村寨日常生活 及生产活动中均操撒尼语。在社会交往、商业领域，以及政 治生活中，也主要以撒尼语为交际工具。石林境内及邻近地 区的彝青人、白彝人等彝族支系群众，以及石林县的不少汉 族群众，在和撒尼人交往时也使用撒尼语。 由于种种原因，石林县的公务人员、事业单位人员以及 与撒尼群众交往密切的第三产业从业人员中，通晓撒尼语的 人却不多，部分撒尼人出身的干部的撒尼语也不够熟练。这 种情形，与撒尼语在群众中广泛通行极不相称，对密切党群 关系、干群关系，对政务畅通，也有一定影响。 近年来，许多人陆续提出学习撒尼语的要求，我们也曾开展撒尼语教学实验，取得了一定效果，但因汉 字难以准确注音，学习效果不理想，事倍功半。《石林撒尼 誉目 说明/1 一、 问候与拜访 /1 二、做什么？去哪里？／ 11 三、询问/19 四、介绍/29 五、喜好/35 六、请求帮助/ 39 七、问路／45 八、时间／ 51 九、年龄／57 十、语言/ 63 十一、天气/69 十二、购物／77 十三、比较/83 十四、衣着／89 十五、打电话／93 十六、看病／99 一、问候与拜访 五、石彝输入法编码表· 四、学习石彝输入法· 地址：昆明市环城西路170号云南民族大厦6楼电话：0871-5340364、0871-5340743 软件的使用环境和范围 软件卸载· 软件安装·· 《石林蜂文平台》操作手册 录 9 3 2 角的益图标，单击鼠标右键，单击“设置”，进入如卜界面： 安装Windows 打开软件光盘。 单击桌面有下角输入法图标彝，将输入法切换为英文输入状态当，将鼠标指向桌面右下 1、卸载输入法 、软件卸载 石林师文学库及输入法安装 单击“确定”，进入下一界面： 2、双击运行光盘中的“存样XP”的EXE文件，进入如下界面： 1、将软件光盘放入光题，双击操价系统泉面丨的“我的电”图标，再双击“光盘”图标， 软件安装(以WINXP操作系统为例) 地址：昆明市环城西路170号云南民族大厦6楼电话：0871-53-40364、0871-5340743 《石林葬文平台》操作手册","page":"163","audio":"audio/401.mp3","theme":"介绍石林"}];
const THEMES=["问候与拜访", "做什么 去哪里", "询问", "介绍", "喜好", "请求帮助", "问路", "时间", "年龄", "语言", "天气", "购物", "比较", "衣着", "打电话", "看病", "照相", "理发", "餐馆", "乘车", "农业", "工作", "教育", "婚姻", "旅游", "介绍石林"];
const $=id=>document.getElementById(id);
let curTheme="";
function esc(s){return (s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
$("chips").innerHTML='<div class="chip on" data-t="">全部</div>'+THEMES.map(t=>`<div class="chip" data-t="${t}">${t}</div>`).join("");
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");
  if(c){curTheme=c.getAttribute("data-t");document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");render();return;}
  const p=e.target.closest(".play");
  if(p){
    const a=$("au"); a.src=p.getAttribute("data-src");
    document.querySelectorAll(".play").forEach(x=>x.classList.remove("playing"));
    p.classList.add("playing");
    a.play().catch(()=>alert("音频加载失败"));
    a.onended=()=>p.classList.remove("playing");
  }
});
function render(){
  const q=$("q").value.trim().toLowerCase();
  let rs=D;
  if(curTheme) rs=rs.filter(r=>r.theme===curTheme);
  if(q) rs=rs.filter(r=>((r.han||"")+(r.ipa||"")+(r.zhuyin||"")+(r.zy||"")).toLowerCase().includes(q));
  $("count").textContent=`共 ${rs.length} 句${curTheme?"（"+curTheme+"）":""}`;
  $("list").innerHTML=rs.map(r=>`<div class="card">
    <div class="num">${r.num}</div>
    <div class="body">
      <div class="han">${esc(r.han)}</div>
      ${r.ipa?`<div class="ipa">${esc(r.ipa)}${r.tag?`<span class="tag">${r.tag}</span>`:""}</div>`:
        (r.tag==="识别失败"?`<div class="zy">（国际音标识别失败，原值已保留待校）</div>`:"")}
      ${r.zhuyin?`<div class="zy">注音：${esc(r.zhuyin)}</div>`:""}
      ${r.zy&&r.zy!==r.han?`<div class="zy">直译：${esc(r.zy)}</div>`:""}
    </div>
    <button class="play" data-src="${r.audio}" title="播放录音">🔊</button>
  </div>`).join("");
}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")render();});
render();
</script></body></html>
