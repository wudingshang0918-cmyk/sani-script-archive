const $ = s => document.querySelector(s);
const YI = u => String.fromCodePoint(u);
let curOnset = "";
const onsets = [...new Set(D.map(x=>x.onset))].sort();
function renderOnsets(){
  const box = $('#onsets'); box.innerHTML='';
  const all = document.createElement('div'); all.className='onset'+(curOnset===''?' on':''); all.textContent='全部声母';
  all.onclick = () => { curOnset=''; render(); }; box.appendChild(all);
  onsets.forEach(o=>{
    const d=document.createElement('div'); d.className='onset'+(curOnset===o?' on':'');
    d.textContent = o==='零声母' ? o : o;
    d.onclick = () => { curOnset = (curOnset===o?'':o); render(); };
    box.appendChild(d);
  });
}
function render(){
  renderOnsets();
  const q = $('#q').value.trim().toLowerCase(), ft = $('#ft').value;
  const hit = D.filter(s => {
    if (curOnset && s.onset !== curOnset) return false;
    if (q && !(s.ipa.toLowerCase().includes(q) || s.c.some(c=>c.i.toLowerCase().includes(q) || c.n.toLowerCase().includes(q)))) return false;
    if (ft && !s.c.some(c=>c.t===ft)) return false;
    return true;
  });
  $('#stat').textContent = `${hit.length} / ${D.length} 个音节`;
  const box = $('#list'); box.innerHTML = '';
  if (!hit.length){ box.innerHTML='<div class="empty">没有匹配的音节</div>'; return; }
  hit.forEach(s=>{
    const chars = ft ? s.c.filter(c=>c.t===ft) : s.c;
    const d = document.createElement('div'); d.className='syl';
    d.innerHTML = `<div class="sh"><span class="ipa">${s.ipa}</span>
      <span class="cnt">共 <b>${chars.length}</b> 字头${ft?'（筛选后）':` · 主字头 ${s.hu} · 异体 ${s.yi}`}</span></div>
      <div class="grid">${chars.map(c=>`<div class="ch ${c.t==='异体'?'vr':''}" title="${c.n} | ${c.t} | 原书第${c.p}页 | ${c.i}">
        <div class="g"><span class="yi">${YI(c.u)}</span></div>
        <div class="id">${c.i}</div><div class="nm">${c.n}</div></div>`).join('')}</div>`;
    box.appendChild(d);
  });
}
$('#q').addEventListener('input', render);
$('#ft').addEventListener('change', render);
render();
</script></body></html>
