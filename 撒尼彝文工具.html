*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.55 "Microsoft YaHei",system-ui,-apple-system,sans-serif;background:#0b1411;color:#e9f1ed}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:17px;margin:0 0 2px;font-weight:600;color:#5fd7b4;letter-spacing:.5px}
.sub{font-size:12px;color:#7f958c;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font:14px inherit;padding:9px 0;border-radius:10px;border:1px solid #24503f;background:#12241e;color:#9dc7b7}
.tabs button.on{background:#5fd7b4;color:#06231a;border-color:#5fd7b4;font-weight:600}
input,textarea{width:100%;font:16px/1.4 inherit;padding:11px 12px;border:1px solid #24503f;background:#12241e;color:#fff;border-radius:10px;outline:none}
input:focus,textarea:focus{border-color:#5fd7b4}
textarea{resize:vertical;min-height:96px;font-family:'Yi',"Microsoft YaHei",sans-serif;font-size:26px;line-height:1.6}
.hint{font-size:12px;color:#7f958c;margin:8px 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row button{font:13px inherit;padding:7px 12px;border-radius:20px;border:1px solid #24503f;background:#12241e;color:#9dc7b7}
.row button.on{background:#5fd7b4;color:#06231a;border-color:#5fd7b4}
.row button.act{background:#f7be00;color:#2a1e00;border-color:#f7be00;font-weight:600}
#n,#n2{font-size:12px;color:#7f958c;margin:6px 2px}
.card{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;margin-bottom:8px;background:#12241e;border:1px solid #1d3d31;border-radius:12px}
.card:active{background:#17402f}
.card.w{background:#101f1a;border-color:#22423a}
.g{font-family:'Yi';font-size:42px;line-height:1.05;min-width:58px;max-width:190px;text-align:center;color:#fff;padding-top:2px;word-break:break-all}
.g.s{font-size:30px}
.meta{flex:1;min-width:0}
.code{font-size:15px;color:#f7be00;font-weight:600;letter-spacing:.4px}
.ipa{font-size:13px;color:#9dc7b7;margin-top:1px}
.mean{font-size:13px;color:#a8bdb4;margin-top:4px;line-height:1.5}
.mini{font-size:11px;color:#5d7a6e;margin-top:4px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#24503f;color:#9dc7b7;margin-left:6px;vertical-align:1px}
.more{margin-top:7px;font-size:12.5px;color:#8fa79e;border-top:1px dashed #24443a;padding-top:6px;display:none}
.more.open{display:block}

const $=s=>document.querySelector(s);
const toneOf=c=>c.endsWith('t')?'t':(c.endsWith('p')?'p':'n');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

H.forEach((h,ix)=>{h.m.forEach(w=>{w=String(w).split('（')[0].split('(')[0].trim();if(w&&w.length<12)(byH[w]=byH[w]||[]).push(ix)})});
W.forEach((w,ix)=>{w.m.forEach(v=>{v=String(v).split('（')[0].split('(')[0].trim();if(v&&v.length<12)(byW[v]=byW[v]||[]).push(ix)})});

$('#npages').textContent=pages.length;

function cardH(h,showMore){
  const el=document.createElement('div');el.className='card';
  let html='<div class="g" onclick="copyText(\''+h.y+'\')">'+h.y+'</div><div class="meta">'+
    '<div class="code">'+h.z+'</div><div class="ipa">'+esc(h.i)+'</div>'+
    '<div class="mean">'+esc(h.m.join(' / '))+'</div>'+
    '<div class="mini">原词典 p'+h.p+' · '+h.q+' 条词句</div>';
  if(showMore&&h.q){html+='<span class="toggle" onclick="tg(this)">展开 '+h.q+' 条词句 ▾</span>'}
  html+='<span class="toggle" onclick="charImg(this,\''+h.y+'\',\''+esc(h.i).replace(/'/g,'')+'\',\''+esc(h.m.join('/')).replace(/'/g,'')+'\')">存成图片</span>';
  if(showMore&&h.q){html+='<div class="more"></div>'}
  el.innerHTML=html+'</div>';
  return el;
}
function fillMore(cardEl,headIdx){
  const box=cardEl.querySelector('.more');if(!box)return;
  box.innerHTML=W.filter(w=>w.h===headIdx).map(w=>
    '<div class="it"><div class="w">'+esc(w.y)+'</div><div class="d"><b>'+esc((w.m||[]).join(' / '))+'</b><br>'+esc(w.i||'')+(w.z?'　<span style="color:#f7be00">'+w.z+'</span>':'')+'</div></div>').join('');
}
function tg(el){
  const c=el.closest('.card'), m=c.querySelector('.more');
  if(m&&!m.dataset.done){
    const ix=+c.dataset.h; fillMore(c,ix); m.dataset.done='1';
  }
  if(m){m.classList.toggle('open');el.textContent=m.classList.contains('open')?el.textContent.replace('▾','▴'):el.textContent.replace('▴','▾')}
}
function cardW(w){

/* 查字 */
function render(){
  const raw=$('#q').value.trim(), list=$('#list'), n=$('#n');
  list.innerHTML='';
  if(!raw){n.textContent='输入音码（bi）、汉字（盖/毕摩）、音标（pi）或页码（12）';return}
  let hs=[], ws=[], how='';
  if(/^[0-9]+$/.test(raw)){
    hs=H.filter(h=>String(h.p)===raw); ws=W.filter(w=>String(w.p)===raw); how='原书第 '+raw+' 页';
  } else if(/^[a-zA-Z]+$/.test(raw)){
    const k=raw.toLowerCase();
    hs=H.filter(h=>h.z&&h.z.startsWith(k));
    ws=W.filter(w=>w.z&&w.z.startsWith(k));
    const key=x=>(x.z===k?0:1)*1000+x.z.length;
    hs.sort((a,b)=>key(a)-key(b)); ws.sort((a,b)=>key(a)-key(b));
    how='音码「'+k+'」';
  } else {
    const sH=new Set(), sW=new Set();
    for(const ch of raw){(byH[ch]||[]).forEach(i=>sH.add(i));(byW[ch]||[]).forEach(i=>sW.add(i))}
    hs=[...sH].map(i=>H[i]); ws=[...sW].map(i=>W[i]);
    if(!hs.length&&!ws.length)H.forEach((h,i)=>{if(h.i.includes(raw))hs.push(h)});
    how='「'+raw+'」';
  }
  if(toneF)hs=hs.filter(h=>h.z&&toneOf(h.z)===toneF);
  if(!hs.length&&!ws.length){list.innerHTML='<div class="empty">没有找到。可试 bi、bir、bit、mu、birmop，或汉字 天/蛇/盖/毕摩</div>';n.textContent=how+' 命中 0 条';return}
  n.textContent=how+' 命中 '+hs.length+' 个字头'+(ws.length?'、'+ws.length+' 条词组':'');
  const cap=Math.min(hs.length,120);
  hs.slice(0,cap).forEach((h,i)=>{const c=cardH(h,true);c.dataset.h=H.indexOf(h);list.appendChild(c)});
  ws.slice(0,120).forEach(w=>list.appendChild(cardW(w)));
}
function setTone(btn,v){toneF=v;[...btn.parentNode.children].forEach(b=>b.classList.remove('on'));btn.classList.add('on');render()}
$('#q').addEventListener('input',render);
/* 输入 */
function render2(){
  const raw=$('#q2').value.trim(),list=$('#list2'),n=$('#n2');
  list.innerHTML='';
  if(!raw){n.textContent='打音码出候选，点一下加进草稿';return}
  const k=raw.toLowerCase();
  let hs=H.filter(h=>h.z&&h.z.startsWith(k)), ws=W.filter(w=>w.z&&w.z.startsWith(k));
  const key=x=>(x.z===k?0:1)*1000+x.z.length;
  hs.sort((a,b)=>key(a)-key(b)); ws.sort((a,b)=>key(a)-key(b));
  n.textContent='音码「'+k+'」→ '+hs.length+' 个字头、'+ws.length+' 条词组';
  if(!hs.length&&!ws.length){list.innerHTML='<div class="empty">没有这个音码。可试 bi / bir / bit / mu / birmop</div>';return}
  hs.slice(0,60).forEach(h=>{
    const el=cardH(h,false);el.dataset.h=H.indexOf(h);
    el.onclick=e=>{if(e.target.classList.contains('g')){copyText(h.y);return}const t=$('#draft');t.value+=h.y;toast('加入 '+h.y)};
    list.appendChild(el);
  });
  ws.slice(0,60).forEach(w=>{
    const el=cardW(w);
    el.onclick=e=>{if(e.target.innerText==='复制'||e.target.closest('.toggle'))return;const t=$('#draft');t.value+=w.y;toast('加入 '+w.y)};
    list.appendChild(el);
  });
}
$('#q2').addEventListener('input',render2);
/* 词典 */
function render3(){
  const hs=H.map((h,i)=>[h,i]).filter(x=>x[0].p===pages[curPage]);
  $('#pglab').textContent='原词典第 '+pages[curPage]+' 页（'+(curPage+1)+'/'+pages.length+'）';
  const l=$('#list3');l.innerHTML='';
  hs.forEach(([h,i])=>{const c=cardH(h,true);c.dataset.h=i;l.appendChild(c)});
  W.filter(w=>w.p===pages[curPage]).forEach(w=>l.appendChild(cardW(w)));
}
function page(d){curPage=Math.min(pages.length-1,Math.max(0,curPage+d));render3()}
/* 通用 */
function tab(i){
  for(let k=0;k<3;k++){$('#p'+k).classList.toggle('hide',k!==i);$('#t'+k).classList.toggle('on',k===i)}
  if(i===0)render();if(i===1)render2();if(i===2)render3();
  window.scrollTo(0,0);
}
function copyText(t){
  if(!t){toast('没有可复制的内容');return}
  const done=()=>toast('已复制 '+(t.length>12?t.slice(0,12)+'…':t));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>legacy(t,done));
  else legacy(t,done);
}
function legacy(t,cb){const i=document.createElement('textarea');i.value=t;i.style.position='fixed';i.style.opacity=0;document.body.appendChild(i);i.select();try{document.execCommand('copy');cb()}catch(e){toast('复制失败，请长按选中')}document.body.removeChild(i)}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1700)}
/* 存成图片 */
async function drawImg(text,title,sub){
  try{await document.fonts.load('48px Yi');await document.fonts.ready}catch(e){}
  const fs=48,lh=fs*1.75,pad=36,Wd=760;
  const c=document.createElement('canvas'),ctx=c.getContext('2d');
  const chars=[...text],maxPer=Math.max(1,Math.floor((Wd-pad*2)/fs)),lines=[];
  for(let i=0;i<chars.length;i+=maxPer)lines.push(chars.slice(i,i+maxPer).join(''));
  const Ht=pad*2+70+lines.length*lh+40;
  c.width=Wd;c.height=Ht;
  ctx.fillStyle='#0b1411';ctx.fillRect(0,0,Wd,Ht);
  ctx.fillStyle='#5fd7b4';ctx.font='600 22px "Microsoft YaHei",sans-serif';ctx.fillText(title||'撒尼彝文',pad,pad+22);
  ctx.fillStyle='#527066';ctx.font='14px "Microsoft YaHei",sans-serif';if(sub)ctx.fillText(sub,pad,pad+48);
  ctx.fillStyle='#ffffff';ctx.font=fs+'px Yi,"Microsoft YaHei",sans-serif';
  lines.forEach((ln,i)=>ctx.fillText(ln,pad,pad+96+i*lh));
  ctx.fillStyle='#527066';ctx.font='12px "Microsoft YaHei",sans-serif';
  ctx.fillText('撒尼彝文工具 · 石林撒尼彝语数字资料整理',pad,Ht-18);
  return c.toDataURL('image/png');
}
async function saveImg(sel,title,noDL){
  const t=$(sel).value.trim();if(!t){toast('先写点内容');return}
  const url=await drawImg(t,title,t.length+' 个字符');
  if(!noDL){const a=document.createElement('a');a.href=url;a.download=title+'.png';a.click()}
  const box=$('#imgbox1');box.innerHTML='<div class="hint">图片已生成（手机浏览器会存到「下载」里；想直接发微信，长按下面这张图 → 保存/发送）</div>';
  const im=new Image();im.src=url;box.appendChild(im);
  toast(noDL?'图片预览':'已生成图片');
}
async function charImg(el,y,ipa,mean){
  const box=el.closest('.meta');
  const url=await drawImg(y,'撒尼彝文：「'+String(mean).split('/')[0]+'」',ipa+'　释义：'+mean);
  const old=box.querySelector('canvas');if(old)old.remove();
  const im=new Image();im.src=url;box.appendChild(im);
  toast('长按图片保存 / 发微信');
}
render();
/* ?tab=1&q=bi 直接定位 */
(function(){
  const p=new URLSearchParams(location.search);
  const t=parseInt(p.get('tab')||'0',10);
  const qv=p.get('q')||'';
  if(qv){$('#q').value=qv;$('#q2').value=qv}
  if(t>0||qv)tab(t||0);
  const dv=p.get('draft');
  if(dv){$('#draft').value=dv;tab(1);saveImg('#draft','撒尼彝文',true)}
})();
