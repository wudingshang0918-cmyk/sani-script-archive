const $ = s => document.querySelector(s);
const N = c => c ? 'U' + c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0') + '.png' : '';
const chaps = [...new Set(D.map(x=>x.c))];
chaps.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; $('#ch').appendChild(o); });

function render(){
  const q = $('#q').value.trim(), ch = $('#ch').value;
  const hit = D.filter(x => (!ch || x.c===ch) && (!q || x.w.includes(q) || x.c.includes(q)));
  $('#stat').textContent = `显示 ${hit.length} / ${D.length} 词   ·   有彝文 ${D.filter(x=>x.g).length}`;
  const box = $('#list'); box.innerHTML = '';
  if(!hit.length){ box.innerHTML = '<div class="empty">没有匹配的词</div>'; return; }
  let cur = null;
  hit.forEach(x => {
    if(x.c !== cur){
      cur = x.c;
      const n = D.filter(y=>y.c===x.c).length;
      const h = document.createElement('div'); h.className='chap';
      h.innerHTML = x.c + `<span>${n} 词</span>`; box.appendChild(h);
    }
    const r = document.createElement('div'); r.className='row';
    const gb = x.g ? `<div class="gb">${[...x.g].map(c=>`<img src="glyphs/${N(c)}" alt="">`).join('')}</div>`
                   : `<div class="nog">彝文待补</div>`;
    const tag = !x.g ? '<span class="tag wait">待补</span>'
              : (x.s.startsWith('低') ? '<span class="tag low">低置信</span>' : '<span class="tag">已配</span>');
    r.innerHTML = `<div class="n">${D.indexOf(x)+1}</div><div class="wd">${x.w}</div>
                   <div class="pg">第${x.p}页</div>${gb}${tag}`;
    box.appendChild(r);
  });
}
$('#q').addEventListener('input', render);
$('#ch').addEventListener('change', render);
render();
</script></body></html>
