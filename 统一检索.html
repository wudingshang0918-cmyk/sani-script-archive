<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一检索 · 石林撒尼彝语数字资料整理</title>
<link rel="stylesheet" href="assets/subpage.css">
<style>
.appbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.appbar a{text-decoration:none;color:var(--ink-2);font-size:12.5px;border:1px solid var(--line);
  border-radius:999px;padding:7px 13px}
.appbar a:hover{color:var(--ink);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
.appbar a.on{background:rgba(193,73,47,.3);border-color:rgba(193,73,47,.9);color:#fff;font-weight:600}
.frame{border:1px solid rgba(255,255,255,.16);border-radius:var(--r-card);overflow:hidden;
  background:#0A0C0D;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.frame iframe{width:100%;height:calc(100dvh - 640px);min-height:360px;border:0;display:block;background:#fff}
.hint{margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.hint a{color:var(--accent);text-decoration:none}
@media (max-width:820px){.frame iframe{height:calc(100dvh - 520px);min-height:340px}}

/* 手机端外壳：标签横滚 + iframe 撑高 */
@media (max-width:760px){
  .appbar{flex-wrap:nowrap;overflow-x:auto;gap:7px;padding-bottom:6px;margin-bottom:10px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .appbar::-webkit-scrollbar{display:none}
  .appbar a{flex:0 0 auto;padding:9px 13px;font-size:13px}
  .frame iframe{height:calc(100svh - 330px);min-height:420px}
  .hint{font-size:11.5px;line-height:1.7;margin-top:8px}
}
</style>
</head>
<body>
<div class="sp-top">
  <a class="sp-back" href="index.html">← 首页</a>
  <span class="sp-title">统一检索</span>
  <span class="sp-stat">1,051 字头 · 9,727 词条</span>
</div>

<div class="sp-wrap">
  <div class="sp-head" style="margin-bottom:12px">
    <h1 style="font-size:clamp(19px,1.8vw,24px)">一个框，查遍字头、词条与例句</h1>
    <p style="font-size:12.5px">音码、汉字、页码、彝文字形都能搜。1,051 个字头 / 9,727 个词条 / 8,676 个词组例句，全在一个检索框里。</p>
  </div>

  <figure class="hero-band"><img src="assets/pic/tongyi.jpg" alt="彝文经卷与毕摩法事" width="1920" height="420" loading="eager" decoding="async"></figure>

</div>

</html>
