<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>石林撒尼彝语数字资料整理</title>
<style>
@font-face{font-family:"SaniYi";src:url("BabelStoneSaniYi.ttf") format("truetype");font-display:swap}
:root{
  --bg:#0A0C0D; --ink:#F3F5F4; --ink-2:rgba(243,245,244,.76); --ink-3:rgba(243,245,244,.64);
  --accent:#C1492F; --accent-2:#D25537;
  --line:rgba(255,255,255,.18); --line-2:rgba(255,255,255,.1);
  --r-card:22px; --r-tile:14px; --r-ctl:12px;
  --sans:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --serif:"Source Han Serif SC","Noto Serif SC","STSong",SimSun,serif;
  --mono:"Consolas","SFMono-Regular",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.yi{font-family:"SaniYi",var(--sans);line-height:1}

.screen{position:relative;height:100dvh;overflow:hidden;display:block}

/* 视频：右移靠近内容框，右缘羽化；卡片压在视频上才看得见真的毛玻璃 */
.media{position:absolute;inset:0;z-index:0;overflow:hidden}
.media video{position:absolute;top:5%;left:-4%;width:100%;height:90%;object-fit:contain;object-position:50% 50%;
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 80%,rgba(0,0,0,.55) 92%,transparent 100%),
    linear-gradient(180deg,transparent 0%,#000 3.5%,#000 96.5%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 0%,#000 80%,rgba(0,0,0,.55) 92%,transparent 100%),
    linear-gradient(180deg,transparent 0%,#000 3.5%,#000 96.5%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.media::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(46% 24% at 0% 0%,rgba(10,12,13,.95) 0%,rgba(10,12,13,.72) 42%,rgba(10,12,13,.22) 72%,rgba(10,12,13,0) 88%),
    radial-gradient(52% 44% at 100% 100%,rgba(10,12,13,.78) 0%,rgba(10,12,13,.28) 55%,rgba(10,12,13,0) 80%),
    linear-gradient(180deg,rgba(10,12,13,.66) 0%,rgba(10,12,13,0) 22%,rgba(10,12,13,0) 78%,rgba(10,12,13,.42) 100%)}

/* 品牌行 */
.topline{position:absolute;top:clamp(22px,3.4vh,36px);left:clamp(24px,3vw,48px);z-index:20;
  display:flex;align-items:center;gap:18px}
.mark{width:56px;height:56px;border-radius:16px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-family:"SaniYi",serif;font-size:28px}
.topline .name{font-size:26px;font-weight:600;letter-spacing:.02em;line-height:1.2}
.topline .en{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--ink-2);margin-top:6px}

/* 右侧：macOS 小组件式卡片列 */
.rail{position:absolute;top:0;right:0;z-index:25;width:clamp(300px,21.5vw,372px);
  height:100dvh;padding:clamp(64px,9vh,92px) clamp(20px,2.4vw,40px) calc(78px + 1.6vh) 0;
  display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail::before{content:"";position:fixed;top:0;right:0;width:clamp(360px,26vw,440px);height:100dvh;z-index:-1;
  background:linear-gradient(90deg,rgba(10,12,13,0) 0%,rgba(10,12,13,.34) 34%,rgba(10,12,13,.6) 100%);
  pointer-events:none}

/* 每一块都是独立小组件：更透、带内高光、真正 blur 到下面的视频 */
.card{
  position:relative;border-radius:var(--r-card);padding:14px 16px 15px;
  background:linear-gradient(180deg,rgba(38,42,44,.5) 0%,rgba(26,30,31,.44) 100%);
  border:1px solid rgba(255,255,255,.26);
  backdrop-filter:blur(44px) saturate(2.1) brightness(1.06);-webkit-backdrop-filter:blur(44px) saturate(2.1) brightness(1.06);
  box-shadow:0 20px 52px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.46), inset 0 -1px 0 rgba(255,255,255,.07),
             inset 0 0 40px rgba(214,120,84,.05)}
.whead{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.wicon{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;
  font-family:"SaniYi",var(--sans);font-size:11px;color:#fff}
.whead .wt{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink)}
.card .lead{font-size:12.5px;line-height:1.85;color:var(--ink-2)}
.card .lead b{color:var(--ink);font-family:var(--mono);font-weight:600}

/* 收录规模：每条数据一个小方块 */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-tile);
  padding:11px 12px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.stat.wide{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between}
.stat .n{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  color:var(--accent)}
.stat.wide .n{font-size:26px;color:var(--accent)}
.stat .k{font-size:11px;color:rgba(243,245,244,.62);margin-top:4px}
.stat.wide .k{margin-top:0}

/* 检索 */
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);border-radius:var(--r-ctl);padding:5px 5px 5px 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:13px;padding:6px 0}
.search input::placeholder{color:var(--ink-3)}
.search button{border:0;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;
  padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .16s,transform .12s}
.search button:hover{background:var(--accent-2)}
.search button:active{transform:scale(.98)}
.hints{margin-top:9px;font-size:11px;color:var(--ink-3);line-height:1.9}
.hints b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

.srclist{font-size:11.5px;line-height:2;color:var(--ink-3)}
.srclist b{color:var(--ink-2);font-weight:500}

/* 底栏：通栏、六等分、每项加框、点中变色 */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
  gap:10px;padding:12px clamp(14px,2vw,32px) calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(10,12,13,.92);border-top:1px solid var(--line-2)}
.dock a{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;
  color:rgba(243,245,244,.9);font-size:15px;font-weight:600;letter-spacing:.01em;padding:12px 10px;border-radius:var(--r-ctl);
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03);
  transition:background .16s,border-color .16s,color .16s;white-space:nowrap;overflow:hidden}
.dock a .g{font-size:19px;color:#E4663F;font-family:"SaniYi",var(--sans)}
.dock a:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3);color:var(--ink)}
.dock a[aria-current="page"]{background:rgba(193,73,47,.34);border-color:rgba(224,90,58,.95);color:#fff;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px rgba(193,73,47,.25)}
.dock a[aria-current="page"] .g{color:#FFD9CD}

/* ============ 手机端 ============ */
@media (max-width:900px){
  .screen{height:auto;min-height:0;overflow:visible;padding-bottom:0}
  body{padding-bottom:calc(168px + env(safe-area-inset-bottom,0px))}

  /* 视频：改为顶部主视觉，高度可控，底边渐隐入黑 */
  .media{position:relative;height:52svh;min-height:300px;max-height:460px}
  .media video{top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 8%,#000 78%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 8%,#000 78%,transparent 100%);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .media::after{background:linear-gradient(180deg,rgba(10,12,13,.55) 0%,rgba(10,12,13,.1) 30%,
    rgba(10,12,13,.5) 76%,var(--bg) 100%)}

  /* 品牌行：压在视频顶部，字号收小 */
  .topline{position:absolute;top:16px;left:16px;gap:11px;align-items:flex-start}
  .mark{width:40px;height:40px;border-radius:12px;font-size:20px}
  .topline .name{font-size:17px;line-height:1.25;letter-spacing:.01em}
  .topline .en{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;margin-top:4px;color:rgba(243,245,244,.72)}

  /* 卡片列：回到正常文档流，负 margin 让第一张压住视频底边 */
  .rail{position:relative;top:auto;right:auto;width:auto;height:auto;
    padding:0 14px;margin-top:-26px;gap:10px;overflow:visible}
  .rail::before{display:none}
  .card{border-radius:18px;padding:14px 15px 15px;
    backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7)}
  .whead{margin-bottom:9px}
  .card .lead{font-size:13px;line-height:1.8}
  .statgrid{gap:8px}
  .stat{padding:10px 11px 9px;border-radius:12px}
  .stat .n{font-size:19px}
  .stat.wide .n{font-size:23px}
  .stat .k{font-size:11px}
  .search input{font-size:16px}      /* iOS 聚焦不放大 */
  .search button{padding:9px 15px;font-size:13px}

  /* 底栏：两行三列，图标在上文字在下，实底不吃字 */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;
    grid-template-columns:repeat(3,1fr);gap:8px;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));
    background:#0A0C0D;border-top:1px solid rgba(255,255,255,.14);
    box-shadow:0 -12px 30px rgba(0,0,0,.55)}
  .dock a{flex-direction:column;gap:5px;padding:9px 4px;border-radius:11px;
    font-size:11.5px;font-weight:600;letter-spacing:0;line-height:1.25}
  .dock a .g{font-size:18px}
}
@media (max-width:380px){
  .dock a{font-size:11px}
  .dock a .g{font-size:17px}
  .topline .name{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .media video{display:none}
  .media{background:#0E1213 url("assets/hero4.jpg") center/cover no-repeat}
}
</style>
</head>
<body>

<main class="screen">
  <div class="media">
    <video autoplay muted loop playsinline preload="metadata" poster="assets/hero_poster.jpg">
      <source src="assets/hero_final.webm" type="video/webm">
      <source src="assets/hero_final_web.mp4" type="video/mp4">
    </video>
  </div>

  <div class="topline">
    <div class="mark yi">&#xe000;</div>
    <div>
      <div class="name">石林撒尼彝语数字资料整理</div>
      <div class="en">SL-SANI · SHILIN YI ARCHIVE</div>
    </div>
  </div>

  <aside class="rail">
    <section class="card">
      <div class="whead"><span class="wicon yi">&#xe001;</span><span class="wt">这是什么</span></div>
      <p class="lead">石林撒尼彝语的词典、词条与口语句数字化整理。字形依石林彝文字库定形，读音待母语者校订。</p>
    </section>

    <section class="card">
      <div class="whead"><span class="wicon yi">&#xe002;</span><span class="wt">收录规模</span></div>
      <div class="statgrid">
        <div class="stat wide"><span class="n">9,727</span><span class="k">词典词条</span></div>
        <div class="stat"><span class="n">1,051</span><span class="k">字头</span></div>
        <div class="stat"><span class="n">8,676</span><span class="k">词组例句</span></div>
        <div class="stat"><span class="n">67,141</span><span class="k">其它资料</span></div>
        <div class="stat"><span class="n">338</span><span class="k">异体字形</span></div>
      </div>
    </section>

    <section class="card">
      <div class="whead"><span class="wicon yi">&#xe003;</span><span class="wt">检索</span></div>
      <div class="search">
        <input id="q" placeholder="音码 bi、汉字 盖、页码 12">
        <button onclick="go()">查询</button>
      </div>
      <div class="hints">可用 <b>bi</b> 音码 · <b>盖</b> 汉字 · <b>12</b> 原书页码 · <b>毕摩</b> 词</div>
    </section>

    <section class="card">
      <div class="whead"><span class="wicon yi">&#xe004;</span><span class="wt">资料来源</span></div>
      <div class="srclist">
        词典正文 <b>1984《彝汉简明词典》</b><br>
        词组补充 <b>石林彝文电子词典 · 撒尼识字本</b><br>
        字形 <b>石林彝文字库</b>
      </div>
    </section>
  </aside>

  <nav class="dock">
    <a href="字头音节表.html"><span class="g">音</span>字头音节表</a>
    <a href="词库完整版.html"><span class="g">典</span>词库完整版</a>
    <a href="异体字家族.html"><span class="g">族</span>异体字家族</a>
    <a href="彝文工具.html"><span class="g">文</span>撒尼彝文工具</a>
    <a href="口语400句.html"><span class="g">句</span>口语400句点读</a>
    <a href="统一检索.html"><span class="g">检</span>统一检索</a>
  </nav>
</main>

<script>
function go(){
  const v = document.getElementById('q').value.trim();
  location.href = v ? ('unified.html?q=' + encodeURIComponent(v)) : 'unified.html';
}
document.getElementById('q').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('autoplay'); });
}
</script>
</body>
</html>
