<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>异体字家族 · 石林撒尼彝语数字资料整理</title>
<style>
@font-face{font-family:"SaniYi";src:url("BabelStoneSaniYi.ttf") format("truetype");font-display:swap}
:root{
  --bg:#0A0C0D; --ink:#F3F5F4; --ink-2:rgba(243,245,244,.76); --ink-3:rgba(243,245,244,.56);
  --accent:#C1492F; --line:rgba(255,255,255,.14);
  --sans:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --mono:"Consolas","SFMono-Regular",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:48px}
.yi{font-family:"SaniYi",var(--sans);line-height:1}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:14px clamp(16px,3vw,40px);background:rgba(10,12,13,.94);border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px)}
.top a{display:flex;align-items:center;gap:7px;color:var(--ink-2);text-decoration:none;font-size:13px;
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:nowrap}
.top a:hover{color:var(--ink);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.top h1{font-size:16px;font-weight:600}
.top .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.wrap{padding:26px clamp(16px,3vw,40px) 0;max-width:1560px;margin:0 auto}
.lead{font-size:13.5px;line-height:1.95;color:var(--ink-2);margin-bottom:16px}
.lead b{color:var(--accent);font-family:var(--mono)}
.famtool{display:flex;gap:10px;margin-bottom:18px}
.famtool input{flex:1;max-width:420px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;color:var(--ink);font:inherit;font-size:13.5px;outline:0}
.famtool input::placeholder{color:var(--ink-3)}
.famtool input:focus{border-color:rgba(193,73,47,.8)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.fcell{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:16px;padding:14px 10px 11px;
  text-align:center;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.fcell:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
.fcell.on{background:rgba(193,73,47,.22);border-color:rgba(193,73,47,.9)}
.fm{font-family:"SaniYi",serif;font-size:44px;line-height:1.1;color:var(--ink)}
.fv{font-size:11px;letter-spacing:3px;color:var(--accent);height:14px;margin-top:4px}
.fi{margin-top:8px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.famopen{grid-column:1/-1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  border-radius:18px;padding:14px 16px 16px;margin:2px 0 6px}
.fohead{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:12.5px;color:var(--ink-2);
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.fohead b{color:var(--accent);font-family:var(--mono);font-size:13.5px}
.fox{cursor:pointer;color:var(--ink-3);white-space:nowrap}
.fox:hover{color:var(--ink)}
.vrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.vcard{background:rgba(10,12,13,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:12px 8px;text-align:center}
.vcard .v{font-family:"SaniYi",serif;font-size:40px;line-height:1.1}
.vcard .vi{font-size:10px;color:var(--ink-3);font-family:var(--mono);margin-top:6px;line-height:1.6}
.famfoot{grid-column:1/-1;text-align:center;color:var(--ink-3);font-size:12.5px;padding:18px 0 6px;line-height:2}
.fambtn{margin-left:8px;background:rgba(193,73,47,.2);color:#F6D9D2;border:1px solid rgba(193,73,47,.8);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.fambtn:hover{background:rgba(193,73,47,.32)}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .fm{font-size:38px}
  .vcard .v{font-size:34px}
  .top h1{font-size:14px}
  .top .cnt{display:none}
}

/* m-fam */
@media (max-width:640px){
  .grid{gap:8px}
  .fcell{padding:10px 8px 9px;border-radius:14px}
  .fm{font-size:40px}
  .fv{font-size:11px;letter-spacing:2px}
  .fi{font-size:11px}
}

/* 顶部横幅（与二级页同一套） */
.hero-band{position:relative;margin:14px 0 16px;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.16);background:#0B0E0F;box-shadow:0 18px 50px rgba(0,0,0,.38)}
.hero-band img{display:block;width:100%;height:auto}
.hero-band::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px rgba(0,0,0,.45),inset 0 -40px 60px -30px rgba(10,12,13,.9)}
</style>
</head>

const F = D.fam, PAGE = D.pages;
const RID2I = {};
let famShown = 60;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function yi(x){return x ? String.fromCharCode(x) : '';}

function famCard(f){
  return '<div class="fcell" id="fc_'+f.main.id+'" onclick="toggleFam(\''+f.main.id+'\')">'
    + '<div class="fm">'+yi(f.main.pua)+'</div>'
    + '<div class="fv">'+f.variants.slice(0,4).map(()=>'◌').join('')+'</div>'
    + '<div class="fi">'+esc(f.main.ipa)+' · +'+f.variants.length+'异体</div></div>';
}

function famPanelHtml(f){
  const all=[f.main].concat(f.variants);
  const cards=all.map((m,i)=>{
    const pg=PAGE[m.id]||'';
    return '<div class="vcard"><div class="v">'+yi(m.pua)+'</div>'
      +'<div class="vi">'+m.id+(i===0?' · 主字':' · 异体'+i)+'</div>'
      +'<div class="vi">'+esc(m.ipa||'')+(pg?' · 第'+pg+'页':'')+'</div></div>';
  }).join('');
  const pgMain=PAGE[f.main.id]||'';
  return '<div class="famopen" id="fo_'+f.main.id+'">'
    +'<div class="fohead"><span><b>'+esc(f.main.ipa)+'</b> ｜ 主字 '+f.main.id
      +(pgMain?' ｜ 原书第 '+pgMain+' 页':'')+' ｜ '+esc(f.main.name)
      +' ｜ 同组共 '+all.length+' 个字形</span>'
      +'<span class="fox" onclick="toggleFam(\''+f.main.id+'\',1);event.stopPropagation()">收起 ✕</span></div>'
    +'<div class="vrows">'+cards+'</div></div>';
}

function toggleFam(id, close){
  const grid=document.getElementById('famgrid');
  const old=grid.querySelector('.famopen');
  const same=old && old.id==='fo_'+id;
  if(old) old.remove();
  grid.querySelectorAll('.fcell.on').forEach(c=>c.classList.remove('on'));
  if(close||same) return;
  const f=F.filter(x=>x.main.id===id)[0];
  const cell=document.getElementById('fc_'+id);
  if(!f||!cell) return;
  cell.classList.add('on');
  cell.insertAdjacentHTML('afterend', famPanelHtml(f));
  const p=document.getElementById('fo_'+id);
  if(p && p.getBoundingClientRect().top > innerHeight*0.85) p.scrollIntoView({behavior:'smooth',block:'center'});
}

function renderFams(){
  const grid=document.getElementById('famgrid');
  const qi=document.getElementById('famq');
  const q=(qi?qi.value:'').trim().toLowerCase();
  let list=F;
  if(q){
    list=F.filter(f=>[f.main.id,f.main.ipa,f.main.name].concat(f.variants.map(v=>v.id)).join(' ').toLowerCase().includes(q));
  }
  let h=list.slice(0,famShown).map(famCard).join('');
  if(!list.length) h='<div style="grid-column:1/-1;text-align:center;color:var(--ink-3);padding:20px">没有匹配的家族，试试 pu / XX030 / MOP</div>';
  h+='<div class="famfoot">共 '+F.length+' 组'+(q?' · 匹配 '+list.length+' 组':'')+' · 当前显示 '+Math.min(famShown,list.length)
    +(q?'':(list.length>famShown
      ?'<button class="fambtn" onclick="famShown=9999;renderFams()">显示全部 '+list.length+' 组 ▾</button>'
      :'<button class="fambtn" onclick="famShown=60;renderFams()">收起到 60 组 ▴</button>'))
    +'<br>点任意一组，主字与异体就展开在它下面</div>';
  grid.innerHTML=h;
  document.getElementById('cnt').textContent=F.length+' 组 · 338 个异体字形';
}

renderFams();
const qi=document.getElementById('famq');
qi.addEventListener('input',()=>{ famShown = qi.value.trim()? 9999 : 60; renderFams(); });
</script>
